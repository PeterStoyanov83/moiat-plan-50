<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}1Step{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2E7D32;
            --primary-dark: #1B5E20;
            --primary-light: #4CAF50;
            --accent: #C57A1E;          /* warm, not aggressive */
            --bg: #FBF7EE;              /* calm cream */
            --card-bg: #FEFCF7;
            --text: #22302A;
            --muted: #5F6F66;
        }

        body {
            font-family: 'Nunito', sans-serif;
            font-size: 1.12rem;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            padding-bottom: 5.5rem;   /* clear the fixed bottom nav */
        }

        /* shared bottom tab nav (matches ritual/progress) */
        nav.tab {
            position: fixed; bottom: 0; inset-inline: 0; max-width: 28rem; margin: 0 auto;
            background: rgba(254,252,247,.94); backdrop-filter: blur(6px);
            border-top: 1px solid #EFE7D7; padding: .6rem 1.5rem;
            display: flex; justify-content: space-between;
            font-size: .72rem; font-weight: 700; color: var(--muted); z-index: 1030;
        }
        nav.tab a { display: flex; flex-direction: column; align-items: center; gap: .15rem; text-decoration: none; color: inherit; }
        nav.tab a.active { color: var(--primary); }

        h1, h2, h3, h4 { font-weight: 800; color: var(--text); letter-spacing: -0.2px; }

        /* calm minimal header (was a solid green bar) */
        .navbar {
            background-color: transparent !important;
            padding: 1.1rem 0;
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary) !important;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
        }
        .brand-sun {
            width: 30px; height: 30px; border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #FFD180 0%, #FFB74D 60%, rgba(255,183,77,0) 74%);
        }

        .btn-primary-custom {
            background-color: var(--primary); color: #fff; border: none;
            border-radius: 50px; padding: 0.9rem 2.6rem; font-size: 1.15rem;
            font-weight: 800; text-decoration: none; display: inline-block;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 8px 22px rgba(46,125,50,.18);
        }
        .btn-primary-custom:hover { background-color: var(--primary-dark); color: #fff; transform: translateY(-2px); }

        .btn-accent {
            background-color: var(--accent); color: #fff; border: none;
            border-radius: 50px; padding: 0.9rem 2.6rem; font-size: 1.15rem;
            font-weight: 800; text-decoration: none; display: inline-block; transition: background-color 0.2s;
        }
        .btn-accent:hover { background-color: #A5661A; color: #fff; }

        .card-custom {
            background: var(--card-bg);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(34,48,42,.07);
            padding: 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #F2EADB;
        }

        .section-icon { font-size: 2rem; margin-bottom: 0.5rem; }

        .disclaimer {
            background: #FFF8E1;
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            font-size: 0.98rem;
            color: #5D4037;
        }

        footer {
            background: transparent;
            color: var(--muted);
            padding: 2.5rem 0 3rem;
            margin-top: 4rem;
            font-size: 0.95rem;
            border-top: 1px solid #EFE7D7;
        }
        footer a { color: var(--muted); text-decoration: underline; }

        .form-check-label { font-size: 1.08rem; padding-left: 0.3rem; }

        .form-control, .form-select {
            font-size: 1.08rem;
            border-radius: 14px;
            border: 1.5px solid #E7DECC;
            padding: 0.7rem 1rem;
            background: #fff;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 0.2rem rgba(76,175,80,.15);
        }

        .question-block {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.6rem 1.8rem;
            margin-bottom: 1.4rem;
            box-shadow: 0 4px 18px rgba(34,48,42,.05);
            border: 1px solid #F2EADB;
        }
        .question-label { font-weight: 800; font-size: 1.14rem; margin-bottom: 0.8rem; display: block; }

        .step-number {
            width: 52px; height: 52px;
            background: var(--primary); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.35rem; font-weight: 800; flex-shrink: 0;
        }
        .form-check-input:checked { background-color: var(--primary); border-color: var(--primary); }
    </style>
</head>
<body>
<div class="container">
    {% include 'plans/_topnav.html' %}
</div>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <div class="container text-center">
        <p class="mb-1">1Step &copy; 2024 &bull; <a href="{% url 'privacy' %}">Политика за поверителност</a></p>
        <p class="mb-0" style="font-size:0.88rem;">
            Една стъпка всеки ден. Общи препоръки за активен начин на живот —
            при здравословни проблеми се консултирайте с лекар.
        </p>
    </div>
</footer>

{% include 'plans/_bottomnav.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
